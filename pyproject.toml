[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-experiment-framework"
version = "0.1.0"
description = "Modular RL experiment framework for locomotion and organism competitions"
requires-python = ">=3.10"
dependencies = [
  "gymnasium==1.2.3",
  "pettingzoo==1.25.0",
  "supersuit==3.10.0",
  "stable-baselines3==2.8.0",
  "pybullet==3.2.7",
  "omegaconf==2.3.0",
  "numpy==2.2.6",
  "tensorboard==2.20.0",
  "PyYAML==6.0.3",
  "flask==3.1.3",
  "moviepy==2.2.1"
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "pytest-cov==7.1.0", "ruff==0.14.11"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Non-Python assets the package loads at runtime. `configs/` and the GUI
# static/template folders have no __init__.py, so package discovery skips them
# and they are only shipped when named here.
rl_framework = [
  "configs/experiments/*.yaml",
  "gui/static/*",
  "gui/templates/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# tests/fixtures/legacy_checkpoints/walker was saved before the move to
# core/training/: its cloudpickled lr_schedule still names the old
# src/rl_framework/training/sb3_runner.py, so loading it makes coverage record
# a file that no longer exists and warn "couldnt-parse" at report time.
omit = ["*/rl_framework/training/*"]
