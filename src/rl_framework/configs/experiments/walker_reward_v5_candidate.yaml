# Paired CANDIDATE for the clearance-farm screen (2026-07-28).
#
# Control is `walker_reward_v4_candidate`, which reached 11/12 frozen gates --
# the best so far -- but got there while hopping on its right leg: right foot
# in contact 47.2% against the left's 23.7%, right peaking at 50-80 mm while
# the left swung 150-270 mm.
#
# Cause: the env feeds `swing_clearance` from `GaitStep.swing_clearance_now`,
# the MAX over swinging feet, so one high leg collects full credit. v4 kept 71%
# of the clearance reward while measured per-foot clearance fell 49%, and paid
# a 4.8x larger symmetry penalty to do it because the farm was worth more.
#
# This arm changes exactly one thing: `swing_clearance_weight` 8.0 -> 0 and
# `bilateral_clearance_weight` 0 -> 8.0. The bilateral term pays the LOWER of
# the two feet's most recent swing clearances, densely, so both legs must lift
# to earn it. It is deliberately NOT a per-touchdown payment: that form scales
# with touchdown count and would work against the cadence ceiling v4 just
# passed (7.30 against a limit of 8.5).
#
# Same weight and target as the term it replaces, so the two are directly
# comparable: both pay up to 0.4/step at 0.05 m.
experiment_name: walker_reward_v5_candidate
seed: 21

environment:
  type: walker_bullet
  seed: 21
  observation:
    version: v2
    coordinate_free: true
  sim:
    gravity: -9.81
    mass: 28.0
    friction: 0.9
    max_force: 35.0
    timestep: 0.004166667
    frame_skip: 4
    settle_steps: 30
    action_scale: 0.5
    control:
      mode: pd
      position_gain: 0.1
      velocity_gain: 1.0
  terrain:
    preset: flat
  reward:
    alive_bonus: 0.10
    forward_velocity_weight: 1.0
    target_velocity: 0.15        # ramped to 1.0 by training.velocity_target_ramp
    velocity_mode: clipped_linear
    orientation_penalty_weight: 1.0
    torque_penalty_weight: 0.02
    fall_penalty: 2.0
    action_rate_penalty_weight: 0.10
    swing_clearance_weight: 0.0
    bilateral_clearance_weight: 8.0
    bilateral_clearance_target: 0.05
    touchdown_rate_penalty_weight: 1.0
    max_cycle_frequency_hz: 2.5
    flight_penalty_weight: 0.5
    gait_symmetry_penalty_weight: 0.5
    double_support_reward_weight: 0.5
    stance_slip_penalty_weight: 0.35
    stance_slip_penalty_clip: 1.5
  termination:
    min_height: 0.18
    max_height: 1.5
    max_steps: 800
  reset_randomization:
    position_xy_noise: 0.02
    yaw_noise: 0.08
  domain_randomization:
    mass_scale_range: [0.95, 1.05]
    friction_range: [0.9, 1.1]

training:
  algorithm: PPO
  policy: MlpPolicy
  total_timesteps: 10000000
  num_envs: 24
  n_steps: 256
  batch_size: 512
  n_epochs: 10
  learning_rate: 0.0003
  gamma: 0.995
  log_std_init: -1.0
  ent_coef: 0.001
  checkpoint_every: 2000000
  normalize_observations: true
  device: cpu
  velocity_target_ramp:
    start: 0.15
    end: 1.0
    ramp_steps: 3000000

evaluation:
  episodes: 20

output:
  base_dir: outputs
