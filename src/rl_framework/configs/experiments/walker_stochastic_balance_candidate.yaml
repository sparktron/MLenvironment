experiment_name: walker_stochastic_balance_candidate
seed: 42

environment:
  type: walker_bullet
  seed: 42
  observation:
    version: v2
    coordinate_free: true
  sim:
    gravity: -9.81
    mass: 28.0
    friction: 0.9
    max_force: 35.0
    timestep: 0.004166667
    frame_skip: 4
    settle_steps: 30
    action_scale: 0.15
    control:
      mode: pd
      position_gain: 0.1
      velocity_gain: 1.0
  terrain:
    preset: flat
  reward:
    alive_bonus: 1.0
    forward_velocity_weight: 0.5
    target_velocity: 0.0
    velocity_sigma: 0.25
    orientation_penalty_weight: 1.5
    torque_penalty_weight: 0.02
    fall_penalty: 40.0
  termination:
    min_height: 0.18
    max_height: 1.5
    max_steps: 800
  reset_randomization:
    position_xy_noise: 0.02
    yaw_noise: 0.08
  domain_randomization:
    mass_scale_range: [0.95, 1.05]
    friction_range: [0.9, 1.1]

training:
  algorithm: PPO
  policy: MlpPolicy
  total_timesteps: 100000
  num_envs: 24
  n_steps: 128
  batch_size: 256
  n_epochs: 10
  learning_rate: 0.0003
  log_std_init: -1.5
  ent_coef: 0.0
  checkpoint_every: 50000
  normalize_observations: true
  device: cpu

evaluation:
  episodes: 20

output:
  base_dir: outputs
