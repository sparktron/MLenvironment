# Paired CANDIDATE for the gait-period screen (2026-07-28).
#
# Control is `walker_reward_v6_candidate`. The phase clock worked: single
# support went 13.9% -> 62.1% with the legs near-perfectly balanced, and
# anti-phase alternation appeared for the first time. But its 1 Hz schedule is
# kinematically unreachable at the 1.0 m/s target:
#
#   leg (hip->ankle)            0.480 m
#   hip excursion               +/-0.600 rad at action_scale 0.5
#   stride ceiling  2*2L sin(t) 1.084 m
#   -> top speed at 1 Hz        1.08 m/s,  but the policy runs at 1.14 m/s
#
# It cannot satisfy both, so it kept the velocity (1.0/step) and took partial
# phase credit (0.616), stepping at 2.95 Hz against a 1 Hz clock. That leaves
# ~0.17 s per swing, which is why clearance fell to 16.4 mm and failed its gate.
#
# This arm changes ONE number: cycle_period_s 1.0 -> 0.55. At 1.0 m/s that asks
# for a 0.55 m stride, 51% of the kinematic ceiling, and implies 6.06
# alternating touchdowns per 100 steps -- inside the frozen 1.5-8.5 band.
experiment_name: walker_reward_v7_candidate
seed: 21

environment:
  type: walker_bullet
  seed: 21
  observation:
    version: v2
    coordinate_free: true
    include_gait_phase: true
  gait:
    cycle_period_s: 0.55
    stance_duty: 0.6
  sim:
    gravity: -9.81
    mass: 28.0
    friction: 0.9
    max_force: 35.0
    timestep: 0.004166667
    frame_skip: 4
    settle_steps: 30
    action_scale: 0.5
    control:
      mode: pd
      position_gain: 0.1
      velocity_gain: 1.0
  terrain:
    preset: flat
  reward:
    alive_bonus: 0.10
    forward_velocity_weight: 1.0
    target_velocity: 0.15        # ramped to 1.0 by training.velocity_target_ramp
    velocity_mode: clipped_linear
    orientation_penalty_weight: 1.0
    torque_penalty_weight: 0.02
    fall_penalty: 2.0
    action_rate_penalty_weight: 0.10
    swing_clearance_weight: 0.0
    bilateral_clearance_weight: 8.0
    bilateral_clearance_target: 0.05
    touchdown_rate_penalty_weight: 1.0
    max_cycle_frequency_hz: 2.5
    flight_penalty_weight: 0.5
    gait_symmetry_penalty_weight: 0.5
    double_support_reward_weight: 0.0
    phase_contact_weight: 1.0
    stance_slip_penalty_weight: 0.35
    stance_slip_penalty_clip: 1.5
  termination:
    min_height: 0.18
    max_height: 1.5
    max_steps: 800
  reset_randomization:
    position_xy_noise: 0.02
    yaw_noise: 0.08
  domain_randomization:
    mass_scale_range: [0.95, 1.05]
    friction_range: [0.9, 1.1]

training:
  algorithm: PPO
  policy: MlpPolicy
  total_timesteps: 10000000
  num_envs: 24
  n_steps: 256
  batch_size: 512
  n_epochs: 10
  learning_rate: 0.0003
  gamma: 0.995
  log_std_init: -1.0
  ent_coef: 0.001
  checkpoint_every: 2000000
  normalize_observations: true
  device: cpu
  velocity_target_ramp:
    start: 0.15
    end: 1.0
    ramp_steps: 3000000

evaluation:
  episodes: 20

output:
  base_dir: outputs
