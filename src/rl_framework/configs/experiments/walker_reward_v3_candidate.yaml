# Paired CANDIDATE for the walk-vs-run screen (2026-07-28).
#
# Control is `walker_reward_v2_candidate`. That arm moved stride 0.117 -> 0.413 m
# and clearance 7.6 -> 63.4 mm and eliminated falls, but rendering showed it had
# satisfied every stride and clearance term by *running*: 0.7% double support,
# 54% flight, and 30.7% right-foot contact against 16.0% left over 300 steps.
#
# Nothing in that reward distinguishes a walk from a bound, and nothing charges
# left/right asymmetry. This arm adds exactly those two terms and changes
# nothing else. Weights are sized against the measured control:
#   flight_penalty        flight fraction 0.54 -> weight 0.5 charges ~0.27/step
#                         now and 0 for a gait that always keeps a foot down.
#   gait_symmetry_penalty duty imbalance |30.7-16.0|/(30.7+16.0) = 0.315 ->
#                         weight 0.5 charges ~0.16/step now and 0 when even.
# Both are comparable to the velocity term (~1.0/step at target) without
# dominating it.
experiment_name: walker_reward_v3_candidate
seed: 21

environment:
  type: walker_bullet
  seed: 21
  observation:
    version: v2
    coordinate_free: true
  sim:
    gravity: -9.81
    mass: 28.0
    friction: 0.9
    max_force: 35.0
    timestep: 0.004166667
    frame_skip: 4
    settle_steps: 30
    action_scale: 0.5
    control:
      mode: pd
      position_gain: 0.1
      velocity_gain: 1.0
  terrain:
    preset: flat
  reward:
    alive_bonus: 0.10
    forward_velocity_weight: 1.0
    target_velocity: 0.15        # ramped to 1.0 by training.velocity_target_ramp
    velocity_mode: clipped_linear
    orientation_penalty_weight: 1.0
    torque_penalty_weight: 0.02
    fall_penalty: 2.0
    stance_slip_penalty_weight: 0.0
    action_rate_penalty_weight: 0.10
    swing_clearance_weight: 8.0
    swing_clearance_target: 0.05
    touchdown_rate_penalty_weight: 1.0
    max_cycle_frequency_hz: 2.5
    flight_penalty_weight: 0.5
    gait_symmetry_penalty_weight: 0.5
  termination:
    min_height: 0.18
    max_height: 1.5
    max_steps: 800
  reset_randomization:
    position_xy_noise: 0.02
    yaw_noise: 0.08
  domain_randomization:
    mass_scale_range: [0.95, 1.05]
    friction_range: [0.9, 1.1]

training:
  algorithm: PPO
  policy: MlpPolicy
  total_timesteps: 10000000
  num_envs: 24
  n_steps: 256
  batch_size: 512
  n_epochs: 10
  learning_rate: 0.0003
  gamma: 0.995
  log_std_init: -1.0
  ent_coef: 0.001
  checkpoint_every: 2000000
  normalize_observations: true
  device: cpu
  velocity_target_ramp:
    start: 0.15
    end: 1.0
    ramp_steps: 3000000

evaluation:
  episodes: 20

output:
  base_dir: outputs
